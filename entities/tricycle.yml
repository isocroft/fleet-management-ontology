entity:
  name: Tricycle

  description: >
    A tricycle is owned by a company and assigned to a rider by a fleet manager. The fleet manager manages the condition and status of each tricycle.

  properties:

    id:
      type: uuid
      unique: true

    license_plate_number:
      type: string
      unique: true
      constraint: [REGEX:/^[A-Z]{3}[-]([0-9][0-9][1-9])[A-Z]{2}$/]

    vehicle_identification_number:
      type: string
      unique: true
      constraint: [REGEX: /^[A-Z0-9]{17}$/]

    fuel_type:
      type: TricycleEnergySource

    capacity_kg:
      type: double
      constraint: [PRECISION: 10, 2]
  
    state:
      type: TricycleState

    condition:
      type: TricycleCondition

  relationships:

    operated_by:
      target: Rider
      cardinality: one

    property_of:
      target: Company
      cardinality: one

    utilized_for:
      target: Assignment 
      cardinality: many

    managed_by:
      target: FleetManager
      cardinality: zero..one
