ontology:
  name: Fleet Management ontology

  description: >
    An ontology map showing the properties and relationships between companies, tricycle, riders, assignments, fleet_managers, trips and fleet_owners in a fleet management system

  entities:
    - Company
    - Tricycle
    - Rider
    - Person
    - FleetOwner
    - FleetManager
    - Assignment
    - Trip

  enums:
    - TricycleCondition 
    - TricycleState
    - TricycleEnergySource
    - FleetOwnerStatus
    - FleetManagerStatus
    - CompanyStatus
    - AssignmentState
    - AssignmentPhase
    - RiderState
    - RiderNotice
    - TripStatus
